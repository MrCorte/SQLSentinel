# SQLSentinel — storage database only (quickstart)
#
# Starts the SQL Server 2025 instance that SQLSentinel uses for its own data
# (metrics, settings, users, sessions, RAG embeddings), then initializes
# SQLSentinelDB and the app login.
#
# For the full test environment with monitored target servers, use:
#   docker compose -f docker/docker-compose.yml up -d
#
# App connection (storage wizard defaults):
#   Host: localhost  Port: 1437  Database: SQLSentinelDB
#   User: ${SQLSENTINEL_APP_USER}        Password: ${SQLSENTINEL_APP_PASSWORD}
#   User: ${SQLSENTINEL_DOCK_USER}       Password: ${SQLSENTINEL_DOCK_PASSWORD}
#   sa:   ${SQLSENTINEL_STORAGE_SA_PASSWORD}
#
# Usage:
#   docker compose up -d
#   docker compose ps
#   docker compose down -v

services:
  sql-sentinel:
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64
    container_name: sqlsentinel-storage
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${SQLSENTINEL_STORAGE_SA_PASSWORD:?Set SQLSENTINEL_STORAGE_SA_PASSWORD in .env}
      MSSQL_PID: 'Developer'
      MSSQL_MEMORY_LIMIT_MB: '1536'
    ports:
      - '1437:1433'
    volumes:
      - sqlsentinel-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -C 2>/dev/null"
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  sql-sentinel-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64
    container_name: sqlsentinel-storage-init
    depends_on:
      sql-sentinel:
        condition: service_healthy
    volumes:
      - ./docker/init/sentinel.sql:/init/sentinel.sql:ro
    environment:
      SQLSENTINEL_STORAGE_SA_PASSWORD: ${SQLSENTINEL_STORAGE_SA_PASSWORD:?Set SQLSENTINEL_STORAGE_SA_PASSWORD in .env}
      SQLSENTINEL_DOCK_USER: ${SQLSENTINEL_DOCK_USER:?Set SQLSENTINEL_DOCK_USER in .env}
      SQLSENTINEL_DOCK_PASSWORD: ${SQLSENTINEL_DOCK_PASSWORD:?Set SQLSENTINEL_DOCK_PASSWORD in .env}
      SQLSENTINEL_APP_USER: ${SQLSENTINEL_APP_USER:?Set SQLSENTINEL_APP_USER in .env}
      SQLSENTINEL_APP_PASSWORD: ${SQLSENTINEL_APP_PASSWORD:?Set SQLSENTINEL_APP_PASSWORD in .env}
      SQLSENTINEL_MONITOR_USER: ${SQLSENTINEL_MONITOR_USER:?Set SQLSENTINEL_MONITOR_USER in .env}
      SQLSENTINEL_MONITOR_PASSWORD: ${SQLSENTINEL_MONITOR_PASSWORD:?Set SQLSENTINEL_MONITOR_PASSWORD in .env}
    command: >
      bash -c "/opt/mssql-tools18/bin/sqlcmd -S sql-sentinel,1433 -U sa -P \"$$SQLSENTINEL_STORAGE_SA_PASSWORD\" -v DockUser=\"$$SQLSENTINEL_DOCK_USER\" DockPassword=\"$$SQLSENTINEL_DOCK_PASSWORD\" AppUser=\"$$SQLSENTINEL_APP_USER\" AppPassword=\"$$SQLSENTINEL_APP_PASSWORD\" MonitorUser=\"$$SQLSENTINEL_MONITOR_USER\" MonitorPassword=\"$$SQLSENTINEL_MONITOR_PASSWORD\" -i /init/sentinel.sql -b -C"
    restart: 'no'

volumes:
  sqlsentinel-data:
