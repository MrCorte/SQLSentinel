appId: com.sqlsentinel.app
productName: SQL Sentinel
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
extraResources:
  - from: out/service/index.js
    to: service/index.js
  - from: out/service/index.js.map
    to: service/index.js.map
  - from: scripts/install-service.cjs
    to: scripts/install-service.cjs
  - from: scripts/uninstall-service.cjs
    to: scripts/uninstall-service.cjs
  - from: knowledge-pipeline/knowledge_base.db
    to: knowledge_base.db
win:
  executableName: sqlsentinel
  icon: build/icon.ico
  # Code signing is driven by environment variables so the certificate never
  # lives in the repo: set CSC_LINK (path or base64 of the .pfx) and
  # CSC_KEY_PASSWORD in the release workflow. Builds without them are produced
  # unsigned (with a warning) so local/CI builds still succeed before the cert
  # is procured. To switch to Azure Trusted Signing, replace the env vars with a
  # `win.azureSignOptions` block (see RELEASING.md).
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
# Auto-update feed. electron-builder bakes this into app-update.yml at package
# time; the running app (electron-updater) reads it to find new releases, and
# `electron-builder --publish` uploads artifacts + latest.yml to GitHub Releases.
publish:
  provider: github
  owner: MrCorte
  repo: SQLSentinel
mac:
  icon: build/icon.icns
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
    - snap
    - deb
  maintainer: Andrea Cortesi
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
