# SQLSentinel — Test Environment
#
# sql-prod/dev/staging/dr  — Azure SQL Edge, monitored targets
# sql-sentinel             — SQL Server 2025 (amd64), SQLSentinel persistence backend
#                            vector(1536) support required for RAG chunks
#
# Usage:
#   docker compose up -d          — start all containers
#   docker compose up -d sql-init — run DB init (after first start)
#   docker compose down           — stop
#   docker compose down -v        — stop + wipe all data
#
# SQLSentinel Docker login (created by sql-init; sysadmin for local testing).
# Set passwords in a local, uncommitted .env file. See ../.env.example.
#   User: ${SQLSENTINEL_DOCK_USER}
#   Password: ${SQLSENTINEL_DOCK_PASSWORD}
#
# SQLSentinel connections:
#   Production   localhost:1433  ${SQLSENTINEL_DOCK_USER} / ${SQLSENTINEL_DOCK_PASSWORD}
#   Development  localhost:1434  ${SQLSENTINEL_DOCK_USER} / ${SQLSENTINEL_DOCK_PASSWORD}
#   Staging      localhost:1435  ${SQLSENTINEL_DOCK_USER} / ${SQLSENTINEL_DOCK_PASSWORD}
#   DR / Replica localhost:1436  ${SQLSENTINEL_DOCK_USER} / ${SQLSENTINEL_DOCK_PASSWORD}
#   Storage DB   localhost:1437  ${SQLSENTINEL_DOCK_USER} / ${SQLSENTINEL_DOCK_PASSWORD}
#   Storage DB   localhost:1437  ${SQLSENTINEL_APP_USER} / ${SQLSENTINEL_APP_PASSWORD}
#
# Test databases:
#   sql-prod:     AppDB, ReportingDB, ArchiveDB
#   sql-dev:      DevAppDB, TestDB
#   sql-staging:  StagingAppDB, StagingReportingDB
#   sql-dr:       AppDB_DR, AppDB_DR_Archive
#   sql-sentinel: SQLSentinelDB, SentinelAppDB

services:

  # ── Production ─────────────────────────────────────────────────────────────
  sql-prod:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: sqlsentinel-prod
    hostname: sql-prod
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${SQLSENTINEL_PROD_SA_PASSWORD:?Set SQLSENTINEL_PROD_SA_PASSWORD in .env}
      MSSQL_MEMORY_LIMIT_MB: "1024"
    volumes:
      - sql-prod-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -lc 'cat < /dev/null > /dev/tcp/localhost/1433'"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # ── Development ────────────────────────────────────────────────────────────
  sql-dev:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: sqlsentinel-dev
    hostname: sql-dev
    ports:
      - "1434:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${SQLSENTINEL_DEV_SA_PASSWORD:?Set SQLSENTINEL_DEV_SA_PASSWORD in .env}
      MSSQL_MEMORY_LIMIT_MB: "768"
    volumes:
      - sql-dev-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -lc 'cat < /dev/null > /dev/tcp/localhost/1433'"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # ── Staging ────────────────────────────────────────────────────────────────
  sql-staging:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: sqlsentinel-staging
    hostname: sql-staging
    ports:
      - "1435:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${SQLSENTINEL_STAGING_SA_PASSWORD:?Set SQLSENTINEL_STAGING_SA_PASSWORD in .env}
      MSSQL_MEMORY_LIMIT_MB: "768"
    volumes:
      - sql-staging-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -lc 'cat < /dev/null > /dev/tcp/localhost/1433'"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # ── DR / Replica ───────────────────────────────────────────────────────────
  sql-dr:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: sqlsentinel-dr
    hostname: sql-dr
    ports:
      - "1436:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${SQLSENTINEL_DR_SA_PASSWORD:?Set SQLSENTINEL_DR_SA_PASSWORD in .env}
      MSSQL_MEMORY_LIMIT_MB: "768"
    volumes:
      - sql-dr-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -lc 'cat < /dev/null > /dev/tcp/localhost/1433'"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # ── SQLSentinel persistence backend (SQL Server 2025) ─────────────────────
  # Requires SQL Server 2025 for native vector(1536) type (RAG embeddings).
  # Platform: linux/amd64 — SQL Server 2025 does not ship an ARM64 image.
  sql-sentinel:
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64
    container_name: sqlsentinel-sentinel
    hostname: sql-sentinel
    ports:
      - "1437:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${SQLSENTINEL_STORAGE_SA_PASSWORD:?Set SQLSENTINEL_STORAGE_SA_PASSWORD in .env}
      MSSQL_MEMORY_LIMIT_MB: "1536"
    volumes:
      - sql-sentinel-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -C 2>/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  # ── Init (one-shot — runs once then exits) ─────────────────────────────────
  # Uses SQL Server 2025 image so sqlcmd18 is available for the sentinel target.
  # Azure SQL Edge targets are reachable from the same container via sqlcmd18 too.
  sql-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64
    container_name: sqlsentinel-init
    depends_on:
      sql-prod:     { condition: service_healthy }
      sql-dev:      { condition: service_healthy }
      sql-staging:  { condition: service_healthy }
      sql-dr:       { condition: service_healthy }
      sql-sentinel: { condition: service_healthy }
    volumes:
      - ./init:/init:ro
    environment:
      SQLSENTINEL_DOCK_USER: ${SQLSENTINEL_DOCK_USER:?Set SQLSENTINEL_DOCK_USER in .env}
      SQLSENTINEL_DOCK_PASSWORD: ${SQLSENTINEL_DOCK_PASSWORD:?Set SQLSENTINEL_DOCK_PASSWORD in .env}
      SQLSENTINEL_APP_USER: ${SQLSENTINEL_APP_USER:?Set SQLSENTINEL_APP_USER in .env}
      SQLSENTINEL_APP_PASSWORD: ${SQLSENTINEL_APP_PASSWORD:?Set SQLSENTINEL_APP_PASSWORD in .env}
      SQLSENTINEL_MONITOR_USER: ${SQLSENTINEL_MONITOR_USER:?Set SQLSENTINEL_MONITOR_USER in .env}
      SQLSENTINEL_MONITOR_PASSWORD: ${SQLSENTINEL_MONITOR_PASSWORD:?Set SQLSENTINEL_MONITOR_PASSWORD in .env}
      SQLSENTINEL_PROD_SA_PASSWORD: ${SQLSENTINEL_PROD_SA_PASSWORD:?Set SQLSENTINEL_PROD_SA_PASSWORD in .env}
      SQLSENTINEL_DEV_SA_PASSWORD: ${SQLSENTINEL_DEV_SA_PASSWORD:?Set SQLSENTINEL_DEV_SA_PASSWORD in .env}
      SQLSENTINEL_STAGING_SA_PASSWORD: ${SQLSENTINEL_STAGING_SA_PASSWORD:?Set SQLSENTINEL_STAGING_SA_PASSWORD in .env}
      SQLSENTINEL_DR_SA_PASSWORD: ${SQLSENTINEL_DR_SA_PASSWORD:?Set SQLSENTINEL_DR_SA_PASSWORD in .env}
      SQLSENTINEL_STORAGE_SA_PASSWORD: ${SQLSENTINEL_STORAGE_SA_PASSWORD:?Set SQLSENTINEL_STORAGE_SA_PASSWORD in .env}
    command: >
      bash -c "
        echo '→ Initializing sql-prod...'     && /opt/mssql-tools18/bin/sqlcmd -S sql-prod,1433     -U sa -P \"$$SQLSENTINEL_PROD_SA_PASSWORD\"     -v DockUser=\"$$SQLSENTINEL_DOCK_USER\" DockPassword=\"$$SQLSENTINEL_DOCK_PASSWORD\" -i /init/prod.sql     -b -C &&
        echo '→ Initializing sql-dev...'      && /opt/mssql-tools18/bin/sqlcmd -S sql-dev,1433      -U sa -P \"$$SQLSENTINEL_DEV_SA_PASSWORD\"      -v DockUser=\"$$SQLSENTINEL_DOCK_USER\" DockPassword=\"$$SQLSENTINEL_DOCK_PASSWORD\" -i /init/dev.sql      -b -C &&
        echo '→ Initializing sql-staging...'  && /opt/mssql-tools18/bin/sqlcmd -S sql-staging,1433  -U sa -P \"$$SQLSENTINEL_STAGING_SA_PASSWORD\"  -v DockUser=\"$$SQLSENTINEL_DOCK_USER\" DockPassword=\"$$SQLSENTINEL_DOCK_PASSWORD\" -i /init/staging.sql  -b -C &&
        echo '→ Initializing sql-dr...'       && /opt/mssql-tools18/bin/sqlcmd -S sql-dr,1433       -U sa -P \"$$SQLSENTINEL_DR_SA_PASSWORD\"       -v DockUser=\"$$SQLSENTINEL_DOCK_USER\" DockPassword=\"$$SQLSENTINEL_DOCK_PASSWORD\" -i /init/dr.sql       -b -C &&
        echo '→ Initializing sql-sentinel...' && /opt/mssql-tools18/bin/sqlcmd -S sql-sentinel,1433 -U sa -P \"$$SQLSENTINEL_STORAGE_SA_PASSWORD\" -v DockUser=\"$$SQLSENTINEL_DOCK_USER\" DockPassword=\"$$SQLSENTINEL_DOCK_PASSWORD\" AppUser=\"$$SQLSENTINEL_APP_USER\" AppPassword=\"$$SQLSENTINEL_APP_PASSWORD\" MonitorUser=\"$$SQLSENTINEL_MONITOR_USER\" MonitorPassword=\"$$SQLSENTINEL_MONITOR_PASSWORD\" -i /init/sentinel.sql -b -C &&
        echo '✓ All databases initialized.'
      "
    restart: "no"

volumes:
  sql-prod-data:
  sql-dev-data:
  sql-staging-data:
  sql-dr-data:
  sql-sentinel-data:
